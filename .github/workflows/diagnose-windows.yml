name: Diagnose Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Proxy configuration
        shell: pwsh
        run: |
          Get-ChildItem env: | Where-Object { $_.Name -match 'PROXY' } | ForEach-Object { "$($_.Name)=$($_.Value)" }
          $p = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -ErrorAction SilentlyContinue
          "ProxyEnable=$($p.ProxyEnable) ProxyServer=$($p.ProxyServer) ProxyOverride=$($p.ProxyOverride)"

      - name: Loopback listener works
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          "listening on $port"
          $listener.Stop()

      - name: Isolated retry test
        run: cargo test --lib download::task::tests::test_download_retry_exhausted_on_server_error -- --nocapture --test-threads=1

      - name: Isolated paper test
        run: cargo test --lib minecraft::loader::paper::tests::fetch_json_recovers_from_transient_bad_payloads -- --nocapture --test-threads=1
