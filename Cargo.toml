[package]
name = "minecraftd"
version = "1.0.0"
edition = "2024"
authors = ["JLUCraft"]
description = "A unified, composable Minecraft instance management library"
license = "GPL-3.0-only"
repository = "https://github.com/JLUCraft/minecraftd"
readme = "README.md"
keywords = ["minecraft", "game-server", "instance-management"]
categories = ["games"]

[dependencies]
tokio = { version = "1", features = [
    "process",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "fs",
    "net",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
parking_lot = "0.13"
shlex = "2"
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
urlencoding = "2"
sha1 = "0.11"
hex = "0.4"
zip = "9"
dirs = "7"
semver = "1"
regex = "1"
cafebabe = "0.8.1"
which = "8"
toml = "1"
md5 = "0.8"
murmur2 = "0.1"
lite-mc-ping = "0.2"
quartz_nbt = { version = "0.2.9", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.11"
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2"
url = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
interprocess = { version = "2", features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "user"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
